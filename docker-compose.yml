version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM_MODE=demo
      - AUTH_REQUIRED=false
      - SEMANTIC_ENABLED=false
      - PORT=8080
    volumes:
      - ./backend/firewall/ml:/app/firewall/ml
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
